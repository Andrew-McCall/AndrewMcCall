<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/chip.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrew McCall</title>
  <link href="/src/style.css" rel="stylesheet">
</head>

<body class="select-none">
  <div id="app"></div>
  <noscript>
    <style>
      /* No-JS fallback: name image fades to black over 30s, leaving a slowly rotating star field */
      @keyframes nojs-fade { to { opacity: 0; } }
      @keyframes nojs-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
      .nojs { position: fixed; inset: 0; overflow: hidden; background: #0c0a09; pointer-events: none; }
      .nojs-stars {
        position: absolute; top: 50%; left: 50%; width: 220vmax; height: 220vmax;
        margin: -110vmax 0 0 -110vmax; transform-origin: center;
        background-color: #0c0a09;
        background-image:
          radial-gradient(circle at 30% 40%, rgba(160, 210, 110, 0.55) 0.5px, transparent 1.5px),
          radial-gradient(circle, rgba(90, 140, 70, 0.35) 0.5px, transparent 1.5px);
        background-size: 93px 93px, 22px 22px;
        animation: nojs-spin 600s linear infinite;
      }
      .nojs-img {
        position: absolute; inset: 0; display: block; width: 100%; height: 100%; margin: 0;
        object-fit: cover; object-position: center;
        user-select: none; -webkit-user-drag: none;
        animation: nojs-fade 30s linear forwards;
      }
    </style>
    <div class="nojs">
      <div class="nojs-stars"></div>
      <img class="nojs-img" src="/nojs.png" alt="Andrew David McCall" draggable="false" />
    </div>
  </noscript>
  <script type="module" src="/src/main.ts"></script>
  <footer class="fixed bottom-1 right-1 italic text-sm hover:text-white transition-colors duration-150 z-10"></footer>
</body>

</html>
