<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/chip.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Search and social metadata. The `%VITE_…%` values are substituted at build
    time from `frontend/.env`, so they ship in the HTML itself rather than being
    written by JavaScript — a crawler that does not render the page still gets a
    real title and description instead of leaving Google to write its own
    summary from the About blurb and the "Now" table.

    These describe the front page, which is what nearly every search result
    points at. `setMeta()` in `src/helpers.ts` rewrites the title, description,
    `og:url` and canonical for the pages that have their own copy (`/posts` and
    each post), so the canonical below is a default, not a claim about every
    route.
  -->
  <title>%VITE_SITE_TITLE%</title>
  <meta name="description" content="%VITE_SITE_DESCRIPTION%" />
  <meta name="author" content="Andrew McCall" />
  <link rel="canonical" href="%VITE_SITE_URL%/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Andrew McCall" />
  <meta property="og:title" content="%VITE_SITE_TITLE%" />
  <meta property="og:description" content="%VITE_SITE_DESCRIPTION%" />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:image" content="%VITE_SITE_IMAGE%" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0c0a09" />

  <link href="/src/style.css" rel="stylesheet">
</head>

<body>
  <div id="app"></div>
  <noscript>
    <style>
      @keyframes nojs-fade { to { opacity: 0; } }
      @keyframes nojs-spin {
        from { transform: scale(1.6) rotate(0); }
        to { transform: scale(1.6) rotate(360deg); }
      }
      .nojs { position: fixed; inset: 0; overflow: hidden; background: #0c0a09; pointer-events: none; }
      .nojs-stars {
        position: absolute; inset: 0; display: block; width: 100%; height: 100%; margin: 0;
        object-fit: cover; object-position: center; transform-origin: center;
        user-select: none; -webkit-user-drag: none;
        animation: nojs-spin 1200s linear 30s infinite;
      }
      .nojs-img {
        position: absolute; inset: 0; display: block; width: 100%; height: 100%; margin: 0;
        object-fit: cover; object-position: center;
        user-select: none; -webkit-user-drag: none;
        animation: nojs-fade 30s linear forwards;
      }
    </style>
    <div class="nojs">
      <img class="nojs-stars" src="/nojs-stars.png" alt="" draggable="false" />
      <img class="nojs-img" src="/nojs.png" alt="Andrew David McCall" draggable="false" />
    </div>
  </noscript>
  <script type="module" src="/src/main.ts"></script>
  <footer class="fixed bottom-1 right-1 italic text-sm hover:text-white transition-colors duration-150 z-10"></footer>
</body>

</html>
