[package]
name = "canvas-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3     # favour runtime speed; the per-frame render/sim is the hot path
lto = true        # fat LTO: cross-inline the small render/neighbour helpers
codegen-units = 1
panic = "abort"
strip = true
